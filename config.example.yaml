# ─────────────────────────────────────────────────────────────────────
# Universal LLM Proxy Configuration
# ─────────────────────────────────────────────────────────────────────

proxy:
  host: "127.0.0.1"
  port: 4000
  # API key that Claude Desktop / Claude Code uses to authenticate with this proxy
  # You can keep this as is, or change it to something secure.
  api_key: "sk-proxy-universal-1234"

# ─────────────────────────────────────────────────────────────────────
# Provider Configuration
# ─────────────────────────────────────────────────────────────────────
# type: "openai"     → For OpenAI-compatible backends (NVIDIA NIM, OpenAI, Groq, Together AI, Ollama, etc.)
# type: "anthropic"  → For Anthropic-compatible backends (pass-through)
#
# Just change base_url, api_key, and model to switch providers!

provider:
  type: "openai"
  base_url: "https://integrate.api.nvidia.com/v1"
  api_key: "YOUR_NVIDIA_API_KEY_HERE"
  model: "z-ai/glm-5.3"

